version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: syncmusic-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: syncmusic
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - syncmusic-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syncmusic-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/syncmusic
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: 7d
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGIN: ${FRONTEND_URL}
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - redis
    networks:
      - syncmusic-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Redis
  redis:
    image: redis:7.0-alpine
    container_name: syncmusic-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "" , "--appendonly", "no"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - syncmusic-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: syncmusic-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - syncmusic-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  mongodb_data:
  redis_data:

networks:
  syncmusic-network:
    driver: bridge
